name: Import pinned GPT-6.1 Sol Racing V3.4 source (one-time)
on:
  push:
    branches:
      - feat/racing-gpt-6.1-sol-v3.4-source
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Copy exact upstream tree, create hashes, and remove this importer
        shell: bash
        run: |
          set -euo pipefail
          source_commit=1ab34b18cbe30145a161b78674ce1b682a9750d0
          source_tree=c86b059a73f6902a68fdcd84cde1141dbccf2885
          source_repo=https://github.com/bielxdh3/6.1racinsol.git
          scratch="$(mktemp -d)"
          git clone --depth 1 --no-checkout "$source_repo" "$scratch"
          test "$(git -C "$scratch" rev-parse HEAD)" = "$source_commit"
          test "$(git -C "$scratch" rev-parse 'HEAD^{tree}')" = "$source_tree"
          dest=benchmarks/racing/runs/gpt-6.1-sol-v3.4/source
          test ! -e "$dest"
          mkdir -p "$dest"
          git -C "$scratch" archive "$source_commit" | tar -xf - -C "$dest"
          SOURCE_REPO_DIR="$scratch" python3 - <<'PY'
          import os, pathlib, hashlib, json, subprocess

          repo = pathlib.Path.cwd()
          base = repo / 'benchmarks/racing/runs/gpt-6.1-sol-v3.4'
          donor = os.environ['SOURCE_REPO_DIR']
          commit = '1ab34b18cbe30145a161b78674ce1b682a9750d0'
          tree = 'c86b059a73f6902a68fdcd84cde1141dbccf2885'
          original_prompt_blob = subprocess.check_output(['git','-C',donor,'rev-parse',f'{commit}:benchmark/racing-v3.4/racing-v3.4.md'],text=True).strip()
          frozen_prompt_blob = subprocess.check_output(['git','rev-parse','HEAD:benchmarks/racing/prompts/racing-v3.4/racing-v3.4.md'],text=True).strip()
          assert original_prompt_blob == frozen_prompt_blob == '9ee30c035cf39ef6a09569936c78950622a9d645'
          raw = subprocess.check_output(['git','-C',donor,'ls-tree','-r','-z',commit])
          files=[]; total=0
          for row in filter(None,raw.split(b'\0')):
              meta, name = row.split(b'\t',1)
              mode, typ, blob = meta.decode('ascii').split()
              assert mode == '100644' and typ == 'blob'
              rel=name.decode('utf-8')
              assert not rel.startswith('/') and '..' not in pathlib.PurePosixPath(rel).parts
              contents=(base / 'source' / rel).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(contents)).encode()+b'\0'+contents).hexdigest()==blob,rel
              files.append(dict(path=rel,mode=mode,git_blob_sha1=blob,sha256=hashlib.sha256(contents).hexdigest(),bytes=len(contents)))
              total+=len(contents)
          assert len(files)==104 and total==142958723,(len(files),total)
          assert len(list((base/'source').rglob('*')))==sum(1 for p in (base/'source').rglob('*') if p.is_dir())+len(files)
          manifest=dict(format='git-blob-byte-exact-v1',model='GPT-6.1 Sol (Racing V3.4)',source_repository='https://github.com/bielxdh3/6.1racinsol',source_branch='main',source_commit=commit,source_tree=tree,snapshot_root='source/',file_count=len(files),total_bytes=total,lfs_pointer_paths=[],repository_bundle=None,files=files)
          (base/'SOURCE-FILES.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          provenance=f"""# GPT-6.1 Sol — Racing-bench V3.4 provenance

          - Model: GPT-6.1 Sol. This is the new V3.4 run, distinct from the old V2.6 GPT-6.1 Sol archive at ../gpt-6.1-sol/.
          - Source repository: https://github.com/bielxdh3/6.1racinsol
          - Pinned source commit: {commit}; Git tree: {tree}.
          - Source V3.4 prompt Git blob: {original_prompt_blob}; identical to the archived benchmark V3.4 prompt. This establishes file identity, not independent confirmation of original prompt delivery.
          - Complete byte-exact archive: {len(files)} Git-tracked files, {total:,} bytes, under [source/](./source/). Per-file SHA-256, Git blob SHA-1 and byte counts: [SOURCE-FILES.json](./SOURCE-FILES.json).
          - Includes gameplay code and its runtime assets, text report, final screenshots, and recorded audio/video evidence present in the upstream commit. Untracked ZIPs, dependencies and commercial reference JPGs are not copied. The benchmark input references are separately archived in ../../prompts/racing-v3.4/refs/.
          - Original report: [verification/REPORT.md](./source/verification/REPORT.md) says 22/22 automated checks passed but explicitly does not claim commercial visual-quality acceptance. These claims were not independently re-verified here.
          - Website: https://racing-gpt-6.1-sol.biel.dev.br/ (provided by the owner; website reachability and gameplay have not been independently confirmed).
          - No full Git-history bundle was created; the exact source commit remains pinned to the upstream repository. The old V2.6 Sol archive and Gemini 3.8 Flash V3.4 archive remain unchanged.
          """
          (base/'SOURCE-PROVENANCE.md').write_text('\n'.join(line.lstrip() for line in provenance.splitlines())+'\n',encoding='utf-8')
          print('VERIFIED',len(files),'original blobs',total,'bytes and original prompt',original_prompt_blob)
          PY
          git rm -f .github/workflows/import-gpt-6-1-sol-v34.yml
          git add benchmarks/racing/runs/gpt-6.1-sol-v3.4
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'archive(racing): vendor exact GPT-6.1 Sol V3.4 source snapshot'
          git push origin HEAD:refs/heads/feat/racing-gpt-6.1-sol-v3.4-source
