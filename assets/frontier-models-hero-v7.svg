        <circle cx="1252" cy="349" r="3" fill="#9fc9ff"/>
        <circle cx="1291" cy="334" r="3" fill="#9fc9ff"/>
      </g>
      <text x="649" y="362" font-size="38" font-weight="800" fill="#f0f8ff">Orbitarium-bench</text>
      <g data-role="run" data-benchmark="orbitarium" data-model="gpt-6.1-sol-source">
    <rect x="650" y="390" width="225" height="56" rx="11" fill="#0e2034" stroke="#25415d"/>
    <rect x="651" y="391" width="4" height="54" rx="2" fill="#facc6b"/>
    <circle cx="670" cy="418" r="4" fill="#facc6b"/>
    <text x="686" y="424" font-size="18" font-weight="650" fill="#eef6ff">GPT-6.1 Sol</text>
  </g>
    <g data-role="run" data-benchmark="orbitarium" data-model="gpt-6-astra-max-frontier-v2">
    <rect x="889" y="390" width="225" height="56" rx="11" fill="#0e2034" stroke="#25415d"/>
    <rect x="890" y="391" width="4" height="54" rx="2" fill="#aaa7ff"/>
    <circle cx="909" cy="418" r="4" fill="#aaa7ff"/>
    <text x="925" y="424" font-size="18" font-weight="650" fill="#eef6ff">GPT-6 Astra</text>
  </g>
    <g data-role="run" data-benchmark="orbitarium" data-model="grok-4.7-solar-source">
    <rect x="1128" y="390" width="225" height="56" rx="11" fill="#0e2034" stroke="#25415d"/>
    <rect x="1129" y="391" width="4" height="54" rx="2" fill="#d2a2ff"/>
    <circle cx="1148" cy="418" r="4" fill="#d2a2ff"/>
    <text x="1164" y="424" font-size="18" font-weight="650" fill="#eef6ff">Grok 4.7</text>
  </g>
    <g data-role="run" data-benchmark="orbitarium" data-model="fable-5.1-frontier-v2">
    <rect x="769.5" y="452" width="225" height="56" rx="11" fill="#0e2034" stroke="#25415d"/>
    <rect x="770.5" y="453" width="4" height="54" rx="2" fill="#72dfbd"/>
    <circle cx="789.5" cy="480" r="4" fill="#72dfbd"/>
    <text x="805.5" y="486" font-size="18" font-weight="650" fill="#eef6ff">Fable 5.1</text>
  </g>
    <g data-role="run" data-benchmark="orbitarium" data-model="gemini-4-argon-source">
    <rect x="1008.5" y="452" width="225" height="56" rx="11" fill="#0e2034" stroke="#25415d"/>
    <rect x="1009.5" y="453" width="4" height="54" rx="2" fill="#83caff"/>
    <circle cx="1028.5" cy="480" r="4" fill="#83caff"/>
    <text x="1044.5" y="486" font-size="18" font-weight="650" fill="#eef6ff">Gemini 4 Argon</text>
  </g>
    </g>
  </g>
</svg>
