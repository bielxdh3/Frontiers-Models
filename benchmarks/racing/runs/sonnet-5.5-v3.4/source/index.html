  html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; font-family: system-ui, "Segoe UI", sans-serif; color: #fff; }

  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 70%, #3a2a1c 0%, #0b0d12 70%); z-index: 50; }

  #loadbar { width: 320px; height: 6px; background: #ffffff22; border-radius: 3px; overflow: hidden; }
  #loadfill { width: 0%; height: 100%; background: linear-gradient(90deg, #ffb347, #ff6a3d); transition: width .15s; }
  #loadmsg { margin-top: 12px; font-size: 13px; opacity: .75; min-height: 18px; }
